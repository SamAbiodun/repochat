<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repochat</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="description" content="Ask any public GitHub repository a question. Answers cite file and line.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Zodiak"; src: url(/static/fonts/zodiak-300-normal.woff2) format("woff2"); font-weight: 300; font-style: normal; font-display: swap; }
  @font-face { font-family: "Zodiak"; src: url(/static/fonts/zodiak-300-italic.woff2) format("woff2"); font-weight: 300; font-style: italic; font-display: swap; }
  @font-face { font-family: "Commit Mono"; src: url(/static/fonts/commit-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Commit Mono"; src: url(/static/fonts/commit-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

  /* Pure cool greyscale. Light is the only signal: the brightest thing on
     screen is what is live. */
  :root {
    --g-0:#f7f8fa; --g-1:#e6e8ec; --g-2:#c5c9d1; --g-3:#9aa0ab; --g-4:#6b7079;
    --g-5:#454952; --g-6:#2a2e36; --g-7:#181b21; --g-8:#0b0d12;
    --bg:var(--g-8); --surface:var(--g-7); --raised:var(--g-6); --line:var(--g-6);
    --line-strong:var(--g-4); --ink:var(--g-1); --ink-muted:var(--g-3); --ink-subtle:#848a97;
    --live:var(--g-0); --live-fg:var(--g-8);
    --sans:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
    --serif:"Zodiak", ui-serif, Georgia, serif;
    --mono:"Commit Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  code, pre, .mono { font-family: var(--mono); font-variant-ligatures: none; }

  header { max-width: 820px; margin: 0 auto; padding: 28px 16px 0; display:flex; align-items:center; justify-content:space-between; }
  .wordmark { display:flex; align-items:center; gap:10px; font-weight:500; letter-spacing:.01em; color:var(--ink); text-decoration:none; }
  .wordmark svg { width:18px; height:18px; display:block; }
  .wordmark svg circle { fill: var(--ink); }
  header a.src { color:var(--ink-muted); text-decoration:none; font-size:13px; }
  header a.src:hover { color:var(--ink); }

  main { max-width: 820px; margin: 0 auto; padding: 56px 16px 140px; }
  h1 { font: 300 44px/1.08 var(--serif); letter-spacing:-.01em; margin:0 0 10px; color:var(--g-0); }
  h1 em { font-style: italic; }
  .sub { color: var(--ink-muted); margin: 0 0 28px; max-width: 520px; }

  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); color:var(--ink); padding:11px 13px; border-radius:6px; font:inherit; outline:none; }
  input:focus { border-color: var(--line-strong); }
  input::placeholder { color: var(--ink-subtle); }
  input:disabled { color: var(--ink-subtle); }
  button { background:var(--raised); color:var(--ink); border:1px solid var(--line); padding:11px 16px; border-radius:6px; font:inherit; font-weight:500; cursor:pointer; }
  button:hover:not(:disabled) { border-color: var(--line-strong); }
  button.primary { background:var(--live); color:var(--live-fg); border-color:var(--live); }
  button:disabled { opacity:.45; cursor:default; }

  #status { font-family: var(--mono); font-size:13px; color: var(--ink-muted); margin: 12px 0 0; min-height: 1.6em; }
  #status .ok { color: var(--ink); }
  #status .err { color: var(--g-0); }

  #chat { margin-top: 36px; display:flex; flex-direction:column; gap:14px; }
  .msg { padding: 14px 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; line-height:1.55; }
  .user { color: var(--ink-muted); border-left: 2px solid var(--line-strong); padding-left: 14px; border-radius:0; }
  .bot { background: var(--surface); border: 1px solid var(--line); }
  .bot.live { background: var(--raised); border-color: var(--line-strong); color: var(--g-0); }
  .bot code { font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .bot pre { background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; overflow:auto; font-size:13px; }
  .bot pre code { padding:0; background:none; }
  .tools { font-family: var(--mono); font-size: 12px; color: var(--ink-subtle); line-height:1.7; padding-left: 2px; }
  .tools div::before { content: "→ "; color: var(--g-5); }

  #ask { position: fixed; left:0; right:0; bottom:0; background: var(--bg); border-top: 1px solid var(--line); padding: 14px 16px; }
  #ask form { max-width: 820px; margin: 0 auto; }
  #ask .hint { max-width:820px; margin: 6px auto 0; font-family: var(--mono); font-size: 11px; color: var(--ink-subtle); }

  @media (prefers-reduced-motion: no-preference) {
    .bot.live { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { border-color: var(--g-3); } }
  }
  @media (max-width: 520px) { h1 { font-size: 34px; } }
</style>
</head>
<body>
<header>
  <a class="wordmark" href="/">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="5" r="2"/><circle cx="20.2" cy="5.8" r="2"/><circle cx="23.8" cy="8.2" r="2"/><circle cx="26.2" cy="11.8" r="2"/>
      <circle cx="27" cy="16" r="2"/><circle cx="26.2" cy="20.2" r="2"/><circle cx="23.8" cy="23.8" r="2"/><circle cx="20.2" cy="26.2" r="2"/>
      <circle cx="16" cy="27" r="2"/><circle cx="11.8" cy="26.2" r="2"/><circle cx="8.2" cy="23.8" r="2"/><circle cx="5.8" cy="20.2" r="2"/>
      <circle cx="5" cy="16" r="2"/>
    </svg>
    repochat
  </a>
  <a class="src" href="https://github.com/SamAbiodun/repochat">source</a>
</header>
<main>
  <h1>Ask the <em>repo.</em></h1>
  <p class="sub">Paste a public GitHub repository. It gets indexed, then an agent answers your questions and cites file and line for every claim.</p>
  <form id="repoForm">
    <input id="url" placeholder="https://github.com/owner/repo" required autocomplete="off" spellcheck="false">
    <button id="indexBtn" class="primary">Index</button>
  </form>
  <div id="status" aria-live="polite"></div>
  <div id="chat"></div>
</main>
<div id="ask">
  <form id="askForm">
    <input id="q" placeholder="Ask about the code" disabled autocomplete="off">
    <button id="askBtn" disabled>Ask</button>
  </form>
  <div class="hint">answers cite path:line · the agent searches, greps and reads files before it answers</div>
</div>
<script>
const $ = id => document.getElementById(id);
let repo = null, history = [];

function setStatus(text, cls) { $('status').innerHTML = ''; const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; $('status').appendChild(s); }

$('repoForm').onsubmit = async e => {
  e.preventDefault();
  $('indexBtn').disabled = true;
  setStatus('starting');
  const r = await fetch('/repos', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({url: $('url').value})});
  if (!r.ok) { setStatus((await r.json()).detail, 'err'); $('indexBtn').disabled = false; return; }
  repo = (await r.json()).repo;
  poll();
};

async function poll() {
  const j = await (await fetch('/repos/' + repo)).json();
  if (j.status === 'ready') {
    setStatus(`${repo} · ${j.files || '?'} files · ${j.chunks || '?'} chunks · ready`, 'ok');
    $('q').disabled = $('askBtn').disabled = false; $('indexBtn').disabled = false; $('q').focus();
    history = []; $('chat').innerHTML = '';
  } else if (j.status === 'failed') {
    setStatus('failed · ' + j.error, 'err'); $('indexBtn').disabled = false;
  } else {
    setStatus(`${j.status} · ${j.files ? j.files + ' files · ' : ''}${j.chunks || 0} chunks`);
    setTimeout(poll, 1500);
  }
}

function el(cls, text) { const d = document.createElement('div'); d.className = cls; if (text) d.textContent = text; $('chat').appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d; }

function render(md) {
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => { blocks.push(`<pre><code>${esc(code.trimEnd())}</code></pre>`); return `\u0000${blocks.length-1}\u0000`; });
  md = esc(md).replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return md.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

$('askForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; $('askBtn').disabled = true;
  el('msg user', q); history.push({role:'user', content:q});
  const tools = el('tools');
  const bot = el('msg bot live');
  const r = await fetch('/chat', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({repo, messages: history})});
  if (!r.ok) { bot.textContent = 'error · ' + (await r.json()).detail; bot.classList.remove('live'); $('askBtn').disabled = false; return; }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', answer = '';
  while (true) {
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true}).replace(/\r\n/g, '\n');
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts) {
      const ev = /^event: (.*)$/m.exec(p)?.[1]; const data = /^data: (.*)$/m.exec(p)?.[1];
      if (ev === 'token') { answer += JSON.parse(data); bot.textContent = answer; }
      else if (ev === 'tool') { const t = JSON.parse(data); const d = document.createElement('div'); d.textContent = `${t.name} ${JSON.stringify(t.input)}`; tools.appendChild(d); }
      window.scrollTo(0, document.body.scrollHeight);
    }
  }
  bot.innerHTML = render(answer); bot.classList.remove('live');
  history.push({role:'assistant', content: answer}); $('askBtn').disabled = false; $('q').focus();
};
</script>
</body>
</html>
