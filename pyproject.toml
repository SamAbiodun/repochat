[project]
name = "repochat"
version = "0.1.0"
description = "Chat with any public GitHub repo. LangGraph agent over Azure OpenAI and Azure AI Search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "azure-search-documents>=11.5",
    "azure-core>=1.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]
ignore = ["B905"]
